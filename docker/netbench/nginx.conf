# All writable paths are under /tmp so the root filesystem can stay read-only.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  keepalive_requests 10000;
  default_type application/octet-stream;

  # JSON access log: request_time helps DevOps Agent / Logs Insights spot slow requests.
  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
    '"xff":"$http_x_forwarded_for","method":"$request_method","uri":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"host":"$hostname"}';
  access_log /dev/stdout json;

  server {
    listen 8080 reuseport;
    root /usr/share/nginx/html;

    location = /health { access_log off; return 200 "ok\n"; }
    location = /      { return 200 "netbench $hostname\n"; }
    location / {
      limit_except GET HEAD { deny all; }
      try_files $uri =404;
    }
  }
}
