AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ECS network mode lab - network layer.
  Private-only VPC (no IGW / no NAT). AWS services are reached through VPC endpoints.

Parameters:
  Prefix:
    Type: String
    Default: netmode-lab
    AllowedPattern: "^[a-z0-9-]{3,20}$"
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PrivateSubnetACidr:
    Type: String
    Default: 10.0.0.0/20
  PrivateSubnetBCidr:
    Type: String
    Default: 10.0.16.0/20
  FlowLogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30]

Resources:
  # ---------------------------------------------------------------- VPC
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Ref Prefix }
        - { Key: Project, Value: !Ref Prefix }

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${Prefix}-private-a" }
        - { Key: Project, Value: !Ref Prefix }

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${Prefix}-private-b" }
        - { Key: Project, Value: !Ref Prefix }

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${Prefix}-private" }
        - { Key: Project, Value: !Ref Prefix }

  PrivateSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # ---------------------------------------------------------------- Security groups
  # Rules are declared as separate resources to avoid circular references.
  # Egress 443 to 0.0.0.0/0 only reaches VPC endpoints / S3 gateway endpoint,
  # because the VPC has no internet route.
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal ALB
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${Prefix}-alb" }
        - { Key: Project, Value: !Ref Prefix }

  TaskSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: awsvpc tasks (pattern A / B1 / B2) - attached per task ENI
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: VPC endpoints and S3 }
      Tags:
        - { Key: Name, Value: !Sub "${Prefix}-task" }
        - { Key: Project, Value: !Ref Prefix }

  Ec2AwsvpcHostSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Container instances that run awsvpc tasks (B1 / B2). No inbound.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: VPC endpoints and S3 }
      Tags:
        - { Key: Name, Value: !Sub "${Prefix}-ec2-awsvpc" }
        - { Key: Project, Value: !Ref Prefix }

  Ec2BridgeSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Container instances for bridge mode (C) - dynamic host ports
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: VPC endpoints and S3 }
      Tags:
        - { Key: Name, Value: !Sub "${Prefix}-ec2-bridge" }
        - { Key: Project, Value: !Ref Prefix }

  Ec2HostSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Container instances for host mode (D)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: VPC endpoints and S3 }
      Tags:
        - { Key: Name, Value: !Sub "${Prefix}-ec2-host" }
        - { Key: Project, Value: !Ref Prefix }

  LoadgenSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Load generator (access via SSM only, no inbound)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: VPC endpoints and S3 }
      Tags:
        - { Key: Name, Value: !Sub "${Prefix}-loadgen" }
        - { Key: Project, Value: !Ref Prefix }

  EndpointSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Interface VPC endpoints
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref VpcCidr, Description: HTTPS from VPC }
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 127.0.0.1/32, Description: No egress }
      Tags:
        - { Key: Name, Value: !Sub "${Prefix}-endpoints" }
        - { Key: Project, Value: !Ref Prefix }

  # ALB inbound: load generator only (people reach the ALB through SSM port forwarding)
  AlbIngressFromLoadgen:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AlbSg
      IpProtocol: tcp
      FromPort: 8001
      ToPort: 8005
      SourceSecurityGroupId: !Ref LoadgenSg
      Description: Listeners 8001-8005 (one per pattern)

  LoadgenEgressToAlb:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LoadgenSg
      IpProtocol: tcp
      FromPort: 8001
      ToPort: 8005
      DestinationSecurityGroupId: !Ref AlbSg

  # ALB -> targets
  AlbEgressToTask:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSg
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      DestinationSecurityGroupId: !Ref TaskSg
  TaskIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSg
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSg

  AlbEgressToBridge:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSg
      IpProtocol: tcp
      FromPort: 32768
      ToPort: 65535
      DestinationSecurityGroupId: !Ref Ec2BridgeSg
  BridgeIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref Ec2BridgeSg
      IpProtocol: tcp
      FromPort: 32768
      ToPort: 65535
      SourceSecurityGroupId: !Ref AlbSg
      Description: Dynamic host port range (bridge mode)

  AlbEgressToHost:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSg
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      DestinationSecurityGroupId: !Ref Ec2HostSg
  HostIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref Ec2HostSg
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSg

  # Load generator -> targets directly (iperf3 5201, HTTP 8080)
  LoadgenEgressToTask:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LoadgenSg
      IpProtocol: tcp
      FromPort: 5201
      ToPort: 5201
      DestinationSecurityGroupId: !Ref TaskSg
  LoadgenEgressToTaskHttp:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LoadgenSg
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      DestinationSecurityGroupId: !Ref TaskSg
  TaskIngressFromLoadgen:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSg
      IpProtocol: tcp
      FromPort: 5201
      ToPort: 5201
      SourceSecurityGroupId: !Ref LoadgenSg
  TaskIngressFromLoadgenHttp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSg
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref LoadgenSg

  LoadgenEgressToBridge:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LoadgenSg
      IpProtocol: tcp
      FromPort: 32768
      ToPort: 65535
      DestinationSecurityGroupId: !Ref Ec2BridgeSg
  BridgeIngressFromLoadgen:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref Ec2BridgeSg
      IpProtocol: tcp
      FromPort: 32768
      ToPort: 65535
      SourceSecurityGroupId: !Ref LoadgenSg

  LoadgenEgressToHost:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LoadgenSg
      IpProtocol: tcp
      FromPort: 5201
      ToPort: 5201
      DestinationSecurityGroupId: !Ref Ec2HostSg
  LoadgenEgressToHostHttp:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LoadgenSg
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      DestinationSecurityGroupId: !Ref Ec2HostSg
  HostIngressFromLoadgen:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref Ec2HostSg
      IpProtocol: tcp
      FromPort: 5201
      ToPort: 5201
      SourceSecurityGroupId: !Ref LoadgenSg
  HostIngressFromLoadgenHttp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref Ec2HostSg
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref LoadgenSg

  # ---------------------------------------------------------------- VPC endpoints
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.api"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSg]
  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.dkr"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSg]
  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSg]
  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssm"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSg]
  SsmMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssmmessages"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSg]
  Ec2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ec2messages"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSg]
  EcsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecs"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSg]
  EcsAgentEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecs-agent"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSg]
  EcsTelemetryEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecs-telemetry"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSg]

  # ---------------------------------------------------------------- VPC Flow Logs (with ECS fields)
  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${Prefix}/vpc-flow-logs"
      RetentionInDays: !Ref FlowLogRetentionDays

  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: vpc-flow-logs.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref "AWS::AccountId" }
      Policies:
        - PolicyName: write-flow-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !GetAtt FlowLogGroup.Arn

  FlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      MaxAggregationInterval: 60
      LogFormat: >-
        ${version} ${account-id} ${interface-id} ${srcaddr} ${dstaddr} ${srcport} ${dstport}
        ${protocol} ${packets} ${bytes} ${start} ${end} ${action} ${log-status}
        ${instance-id} ${pkt-srcaddr} ${pkt-dstaddr} ${az-id}
        ${ecs-cluster-name} ${ecs-service-name} ${ecs-task-id} ${ecs-container-instance-id}
      Tags:
        - { Key: Project, Value: !Ref Prefix }

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub "${Prefix}-VpcId" }
  VpcCidr:
    Value: !Ref VpcCidr
    Export: { Name: !Sub "${Prefix}-VpcCidr" }
  PrivateSubnetA:
    Value: !Ref PrivateSubnetA
    Export: { Name: !Sub "${Prefix}-PrivateSubnetA" }
  PrivateSubnetB:
    Value: !Ref PrivateSubnetB
    Export: { Name: !Sub "${Prefix}-PrivateSubnetB" }
  AlbSg:
    Value: !Ref AlbSg
    Export: { Name: !Sub "${Prefix}-AlbSg" }
  TaskSg:
    Value: !Ref TaskSg
    Export: { Name: !Sub "${Prefix}-TaskSg" }
  Ec2AwsvpcHostSg:
    Value: !Ref Ec2AwsvpcHostSg
    Export: { Name: !Sub "${Prefix}-Ec2AwsvpcHostSg" }
  Ec2BridgeSg:
    Value: !Ref Ec2BridgeSg
    Export: { Name: !Sub "${Prefix}-Ec2BridgeSg" }
  Ec2HostSg:
    Value: !Ref Ec2HostSg
    Export: { Name: !Sub "${Prefix}-Ec2HostSg" }
  LoadgenSg:
    Value: !Ref LoadgenSg
    Export: { Name: !Sub "${Prefix}-LoadgenSg" }
  FlowLogGroupName:
    Value: !Ref FlowLogGroup
